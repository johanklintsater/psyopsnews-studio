name: Puppet Engine - Offline Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/puppet_engine.py'
      - 'tests/test_puppet_engine.py'
      - '.github/workflows/test-puppet-engine.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Test without ElevenLabs credits
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_puppet_engine.py' -v
