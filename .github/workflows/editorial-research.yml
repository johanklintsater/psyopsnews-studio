name: Editorial Research
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect RSS research
        run: python3 src/editorial_research.py
      - name: Upload editorial briefs
        uses: actions/upload-artifact@v4
        with:
          name: psyopsnews-editorial-research
          path: |
            output/research.json
            output/research.md
          retention-days: 7
