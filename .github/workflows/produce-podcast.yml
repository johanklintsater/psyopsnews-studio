name: Produce Podcast Pilot (3 puppets)
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install edge-tts Pillow
      - name: Render three-puppet podcast
        run: python src/produce_podcast.py
      - name: Upload podcast MP4
        uses: actions/upload-artifact@v4
        with:
          name: psyopsnews-podcast-pilot
          path: output/psyopsnews_podcast_pilot.mp4
          retention-days: 14
